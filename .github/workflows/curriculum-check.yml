name: Curriculum consistency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile all Python source files
        run: python -m compileall -q .
      - name: Validate all 36 lessons, hints and reference solutions
        run: python -m pytest -q tests/test_curriculum_consistency.py
